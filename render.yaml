services:
  # FastAPI Backend Web Service
  - type: web
    name: cit-campus-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: cit_scheduling
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: SOLVER_TIME_LIMIT_SEC
        value: "40"
      - key: SOLVER_NUM_WORKERS
        value: "2"
      - key: CORS_ORIGINS
        value: "http://localhost:5173"
