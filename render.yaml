services:
  # 1. FastAPI Web Service
  - type: web
    name: cit-campus-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: cit_scheduling
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: SOLVER_TIME_LIMIT_SEC
        value: "40"
      - key: SOLVER_NUM_WORKERS
        value: "2"

  # 2. Solver Background Worker
  - type: worker
    name: cit-campus-worker
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    dockerCommand: python -m app.worker
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: cit_scheduling
      - key: SOLVER_TIME_LIMIT_SEC
        value: "40"
      - key: SOLVER_NUM_WORKERS
        value: "2"

